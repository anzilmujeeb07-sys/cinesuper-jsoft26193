<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CineSuper - Mini OTT</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</head>

<body>

  <header class="top">
    <div class="brand">
      <h1>🎬 CineSuper</h1>
      <p>Your mini OTT movie library</p>
    </div>
  </header>

  <main>

    <section class="controls">

      <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search movies..."
      >

      <select id="genreFilter">
        <option value="all">All Genres</option>
      </select>

      <select id="languageFilter">
        <option value="all">All Languages</option>
        <option value="Malayalam">Malayalam</option>
        <option value="English">English</option>
        <option value="Tamil">Tamil</option>
        <option value="Hindi">Hindi</option>
      </select>

    </section>

    <p class="movie-count">18 movie(s) found</p>

    <section id="movies">

      <div id="moviesGrid">
        <p class="loading">Loading movies...</p>
      </div>

    </section>

    <div id="movieModal" class="movie-modal">

      <div class="movie-modal-content">

        <button
          id="closeMovieModal"
          class="close-modal"
          type="button"
        >
          ✕
        </button>

        <div id="movieDetails"></div>

      </div>

    </div>

  </main>

  <footer>

    <p>
      Built by
      <strong>Anzil Mujeeb</strong>
      · Reg No:
      <strong>jsoft26193</strong>
    </p>

    <p>
      Jain School of Future Technology
      · Faculty: Sathish Kumar M
    </p>

    <p>
      Powered by Supabase
    </p>

  </footer>

</body>
</html>
