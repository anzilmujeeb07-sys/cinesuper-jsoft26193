<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineSuper</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <h2>CineSuper</h2>
  <a href="#movies">Movies</a>
  <a href="#reviews">Reviews</a>
  <a href="#reviewForm">Add Review</a>
</nav>
  <header class="hero">
  <h1>🎬 CineSuper</h1>
  <p>Discover movies, explore ratings, and share your reviews.</p>
</header>
  <div id="movies"></div>
  <div id="reviews">
  <h2>Latest Reviews</h2>
</div>
  <h2>Add a Review</h2>

<form id="reviewForm">
  <input id="reviewerName" type="text" placeholder="Your name" required>

  <input id="movieId" type="number" placeholder="Movie ID" required>

  <input id="rating" type="number" min="1" max="5" placeholder="Rating (1-5)" required>

  <textarea id="comment" placeholder="Your review"></textarea>

  <button type="submit">Submit Review</button>
</form>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
